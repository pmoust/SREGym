name: Integration Smoke Test

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/workflows/claude.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/workflows/claude.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ── Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ── Cluster tooling ───────────────────────────────────────────────
      - name: Install Kind
        run: |
          curl -Lo /tmp/kind https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
          kind version

      - name: Install Helm
        uses: azure/setup-helm@v4

      # ── Disk ──────────────────────────────────────────────────────────
      # The job needs more disk than a hosted runner leaves free on /. Four
      # kind nodes each keep their own copy of every image they pull, and
      # both the node's containerd store and its /var/log/pods sit in the
      # node container's /var volume under Docker's data root. When / fills,
      # the kind API server stops answering and then the runner itself dies
      # writing its own log, so no diagnostics survive.
      - name: Reclaim disk on /
        run: |
          echo "=== before ==="
          df -h / /mnt || true
          # Toolchains this job never uses: nothing here builds Android,
          # .NET or Haskell code or runs CodeQL. The Python tool cache stays.
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          docker system prune -af
          echo "=== after ==="
          df -h / /mnt || true

      - name: Move Docker's data root to /mnt
        run: |
          # /mnt is the runner's second disk. Moving Docker's data root there
          # moves the kind node volumes, and with them every image the nodes
          # pull and every pod log, off /. The committed kind configs are
          # unchanged, so benchmark hosts are unaffected.
          root_kb=$(df -Pk / | awk 'NR==2 {print $4}')
          mnt_kb=$(df -Pk /mnt 2>/dev/null | awk 'NR==2 {print $4}')
          if [ -z "${mnt_kb}" ] || [ "${mnt_kb}" -le "${root_kb}" ]; then
            echo "::warning::/mnt has no more free space than /; Docker stays on /"
            exit 0
          fi
          sudo systemctl stop docker.socket docker.service
          sudo mkdir -p /mnt/docker
          # Merge into the runner's own daemon.json, which sets the cgroup
          # parent the job runs under, rather than replacing it.
          if [ -s /etc/docker/daemon.json ]; then
            conf=$(jq '. + {"data-root": "/mnt/docker"}' /etc/docker/daemon.json)
          else
            conf='{"data-root": "/mnt/docker"}'
          fi
          printf '%s\n' "${conf}" | sudo tee /etc/docker/daemon.json
          sudo rm -rf /var/lib/docker
          sudo systemctl start docker.service
          docker info --format 'DockerRootDir={{.DockerRootDir}} Driver={{.Driver}}'
          df -h / /mnt

      - name: Pre-pull kind node image
        run: docker pull jacksonarthurclark/aiopslab-kind-x86:latest

      - name: Prepare /run/udev for OpenEBS NDM
        run: sudo mkdir -p /run/udev

      - name: Create kind cluster with Calico
        run: bash kind/setup_kind_cluster.sh x86

      # ── Python environment ────────────────────────────────────────────
      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      # ── Generate mitigation-only tasklist ─────────────────────────────
      - name: Generate tasklist.yml (mitigation-only)
        run: |
          cat > sregym/conductor/tasklist.yml << 'EOF'
          all:
            problems:
              misconfig_app_hotel_res:
                - mitigation
          EOF

      # ── Run smoke test ────────────────────────────────────────────────
      - name: Run smoke test
        run: uv run pytest tests/integration/smoke_test.py -v -s -m integration

      # ── Diagnostics on failure ────────────────────────────────────────
      # First, and cheap, so it still runs when the disk is nearly full.
      - name: Dump disk usage
        if: failure()
        run: |
          echo "=== runner ==="
          df -h || true
          docker system df -v || true
          echo "=== kind nodes ==="
          for node in $(kind get nodes 2>/dev/null); do
            echo "--- ${node} ---"
            docker exec "${node}" df -h /var /var/lib/containerd || true
          done

      - name: Dump cluster diagnostics
        if: failure()
        run: |
          echo "=== Cluster Info ==="
          kubectl cluster-info || true
          echo "=== All Pods (all namespaces) ==="
          kubectl get pods -A -o wide || true
          echo "=== Pod Descriptions (non-Running) ==="
          kubectl get pods -A --no-headers | grep -v Running | awk '{print $1, $2}' | \
            while read ns pod; do
              echo "--- $ns/$pod ---"
              kubectl describe pod "$pod" -n "$ns" 2>/dev/null | tail -30
            done || true
          echo "=== Recent Events ==="
          kubectl get events -A --sort-by='.lastTimestamp' | tail -50 || true

      - name: Export kind logs
        if: failure()
        run: kind export logs /tmp/kind-logs || true

      - name: Upload kind logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kind-logs
          path: /tmp/kind-logs/
          if-no-files-found: ignore
