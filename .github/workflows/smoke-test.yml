name: Integration Smoke Test

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/workflows/claude.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/workflows/claude.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ── Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ── Cluster tooling ───────────────────────────────────────────────
      - name: Install Kind
        run: |
          curl -Lo /tmp/kind https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
          kind version

      - name: Install Helm
        uses: azure/setup-helm@v4

      # ── Disk ──────────────────────────────────────────────────────────
      # The job needs more disk than a hosted runner leaves free on /. Four
      # kind nodes each keep their own copy of every image they pull, and
      # both the node's containerd store and its /var/log/pods sit on / under
      # Docker's data root. When / fills, the kind API server stops answering
      # and then the runner itself dies writing its own log, so no
      # diagnostics survive. On ubuntu-latest /mnt is a directory on the same
      # disk as /, so moving Docker there gains nothing; this cleanup is what
      # gives the job room. Measured on one run: 13G free on / before, 37G
      # after, of which docker system prune freed 1.9G; the step took 118s.
      - name: Reclaim disk on /
        run: |
          echo "=== before ==="
          df -h / || true
          # Toolchains this job never uses: nothing here builds Android,
          # .NET or Haskell code or runs CodeQL. These are most of the 24G
          # this step frees. The Python tool cache stays.
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          docker system prune -af
          echo "=== after ==="
          df -h / || true

      - name: Pre-pull kind node image
        run: docker pull jacksonarthurclark/aiopslab-kind-x86:latest

      - name: Prepare /run/udev for OpenEBS NDM
        run: sudo mkdir -p /run/udev

      - name: Create kind cluster with Calico
        run: bash kind/setup_kind_cluster.sh x86

      # ── Python environment ────────────────────────────────────────────
      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      # ── Generate mitigation-only tasklist ─────────────────────────────
      - name: Generate tasklist.yml (mitigation-only)
        run: |
          cat > sregym/conductor/tasklist.yml << 'EOF'
          all:
            problems:
              misconfig_app_hotel_res:
                - mitigation
          EOF

      # ── Run smoke test ────────────────────────────────────────────────
      - name: Run smoke test
        run: uv run pytest tests/integration/smoke_test.py -v -s -m integration

      # ── Diagnostics on failure ────────────────────────────────────────
      # First, and cheap, so it still runs when the disk is nearly full.
      - name: Dump disk usage
        if: failure()
        run: |
          echo "=== runner ==="
          df -h || true
          docker system df -v || true
          echo "=== kind nodes ==="
          for node in $(kind get nodes 2>/dev/null); do
            echo "--- ${node} ---"
            docker exec "${node}" df -h /var /var/lib/containerd || true
          done

      - name: Dump cluster diagnostics
        if: failure()
        run: |
          echo "=== Cluster Info ==="
          kubectl cluster-info || true
          echo "=== All Pods (all namespaces) ==="
          kubectl get pods -A -o wide || true
          echo "=== Pod Descriptions (non-Running) ==="
          kubectl get pods -A --no-headers | grep -v Running | awk '{print $1, $2}' | \
            while read ns pod; do
              echo "--- $ns/$pod ---"
              kubectl describe pod "$pod" -n "$ns" 2>/dev/null | tail -30
            done || true
          echo "=== Recent Events ==="
          kubectl get events -A --sort-by='.lastTimestamp' | tail -50 || true

      - name: Export kind logs
        if: failure()
        run: kind export logs /tmp/kind-logs || true

      - name: Upload kind logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kind-logs
          path: /tmp/kind-logs/
          if-no-files-found: ignore
